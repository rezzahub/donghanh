name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # The docs site isn't linted or tested here.
      - run: pnpm install --frozen-lockfile --filter '!./site'
      - run: pnpm run lint
      - run: pnpm test

  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [minimal, kanban-gpt]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5

      # Scaffold from local template
      - name: Scaffold ${{ matrix.template }}
        run: |
          mkdir -p /tmp/test-app
          cp -r create-donghanh/templates/${{ matrix.template }}/* /tmp/test-app/

      # Install deps
      - name: Install
        working-directory: /tmp/test-app
        run: bun install

      # TypeScript check
      - name: Type check
        working-directory: /tmp/test-app
        run: bunx tsc --noEmit

      # Run tests (if test files exist)
      - name: Test
        working-directory: /tmp/test-app
        run: |
          if find . -not -path '*/node_modules/*' -name '*.test.ts' | grep -q .; then
            bun test
          else
            echo "No test files found, skipping"
          fi
